services:
  backend:
    container_name: backend
    build:
      context: ./docker/backend
    expose:
      - 8080:8080
    depends_on:
      - database
    networks:
      app-network:

  database:
    container_name: database
    build:
      context: docker/database
    volumes:
      - dbdata:/var/lib/postgresql/data
    expose:
      - 5432:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      app-network:

networks:
  app-network:

volumes:
  dbdata:
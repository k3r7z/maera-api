services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env
    expose:
      - "8080:8080"
    depends_on:
      - database
    networks:
      app-network:

  database:
    container_name: database
    build:
      context: docker/database
    volumes:
      - dbdata:/var/lib/postgresql/data
    expose:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      app-network:

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: maera@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      app-network:

networks:
  app-network:

volumes:
  dbdata:
  pgadmin-data: